<h1>Koha Offline Library Tool</h1>

  <div class="card">
    <h2>Checkout</h2>
<p>Due Date: <input type="date" id="due_date" /><br /><br />
  Patron Card: <input type="tel" id="pat_card" />
  <button onclick="app.change_patron()">Change Patron Card</button><br /><br />
  Barcode: <input type="tel" id="bar_ckout"  onchange="app.checkout()"/><br /><br />
</p>

  </div>

    <button onclick="app.save()">Save</button>
    <button onclick="app.download()">Download data (.koc)</button>
    <button onclick="app.clear()"class="red">Clear</button>
    <button onclick="app.print()">Print Receipt</button><br /><br />

<script>
// App here

// .koc file spec: https://wiki.koha-community.org/wiki/Koha_offline_circulation_file_format

const app = {
  header: "Version=1.0\tGenerator=kolt\tGeneratorVersion=0.1\n",
  data: "",
  data2: [],
  receipt: [],
  get: function (id_in) {
      return document.getElementById(id_in);
  },
  init: function () {
    if(localStorage.getItem("kolt_data")) { 
      app.data = localStorage.getItem("kolt_data");
    } else {
      app.data = app.header;
    }
    if (app.get("due_date")) app.get("due_date").focus();
    setInterval(app.ui, 1000);
  },
  checkout: function () {
const barcode = app.get("bar_ckout").value.trim();

if (!/^316570\d{8}$/.test(barcode)) {
  alert("Invalid item barcode. Item barcodes must start with 316570 and be 14 digits long.");
  app.get("bar_ckout").value = "";
  app.get("bar_ckout").focus();
  return;
}
    // date, issue, pat_card, item_barcode
    app.data = app.data + app.get_date() + "\tissue\t" + app.get("pat_card").value.trim() + "\t" + barcode + "\n";
    
    
    // Record for receipt only (not part of .koc log)
    (function() {
      var dueEl = app.get("due_date");
      var dueVal = dueEl ? dueEl.value : "";
      app.receipt.push({
        type: "issue",
        barcode: app.get("bar_ckout").value,
        due: dueVal
      });
    })();
app.get("bar_ckout").value = "";
    app.get("bar_ckout").focus();
    
  },
  get_date: function () {
    let date_time = new Date().toISOString();
    date_time = date_time.replace("T", " ");
    // date_time = date_time.replace(".", " ");
    date_time = date_time.replace("Z", "");
    date_time = date_time.split(".")[0];
    // console.log(date_time);
    return date_time;
  },
  change_patron: function(){
    const newCard = prompt("Enter new patron card number:");
    if(newCard !== null && newCard.trim() !== ""){
      app.get("pat_card").value = newCard.trim();
      app.receipt = [];
      app.ui();
      alert("Patron card updated. Receipt cleared; .koc log retained.");
      app.get("bar_ckout").focus();
    } else { alert("No change made."); }
  },
  save: function() {
    localStorage.setItem("kolt_data", app.data);
  },
  download: function() {
    // make file blob and parse string into .koc file format
    let date_time = new Date().toISOString();
    date_time = date_time.replace("T", "_");
    date_time = date_time.replace(":", "-");
    date_time = date_time.replace(":", ".");
    date_time = date_time.split(".")[0];
    const content = app.data;
    const blob = new Blob([content], {type: 'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "kolt_" + date_time + ".koc"
    a.style.display = "none"
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
  },
  clear: function () {
    if(confirm("Delete local data?")){
      localStorage.removeItem("kolt_data");
      app.data = app.header;
      alert("Local data deleted.");
    } else { alert("Canceled."); }
  },
  stage: "",
  ui: function () {
    // update results every second
    app.stage = app.data;
    while (app.stage.indexOf("\n") != -1) {
      app.stage = app.stage.replace("\n", "<br />");      
    }
    while (app.stage.indexOf("\treturn\t") != -1) {
      app.stage = app.stage.replace("\treturn\t", "<span class='green_t'> return </span>");   
    }
    while (app.stage.indexOf("\tissue\t") != -1) {
      app.stage = app.stage.replace("\tissue\t", "<span class='red_t'> issue </span>");  
    }
    app.get("stage").innerHTML = app.stage;
    app.save();
  }
};
app.init();


app.print = function () {
  const patron = app.get("pat_card") ? (app.get("pat_card").value || "") : "";
  const list = (typeof app.receipt !== "undefined" && Array.isArray(app.receipt)) ? app.receipt : [];
  const ts = new Date().toLocaleString();

  let body = "<div style='font-family:sans-serif;'>"
           + "<div><strong>Patron:</strong> " + patron + "</div>"
           + "<div><strong>Date:</strong> " + ts + "</div>"
           + "<h3>Items Checked Out</h3>";

  if (list.length === 0) {
    body += "<em>No items to print.</em>";
  } else {
    body += "<table border='1' cellspacing='0' cellpadding='6'><thead>"
          + "<tr><th>Barcode</th><th>Due Date</th></tr></thead><tbody>";
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      if (r && r.type === "issue") {
        body += "<tr><td>" + (r.barcode || "") + "</td><td>" + (r.due || "") + "</td></tr>";
      }
    }
    body += "</tbody></table>";
  }
  body += "</div>";

  const w = window.open("", "", "width=800,height=900");
  w.document.write("<html><head><title>Receipt</title></head><body>" + body + "</body></html>");
  w.document.close();
  w.focus();
  w.print();
  w.close();
};

</script>
